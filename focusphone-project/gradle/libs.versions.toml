[versions]
agp              = "9.2.1"

# AndroidX
coreKtx          = "1.13.1"
appcompat        = "1.7.0"
activityKtx      = "1.9.3"
fragmentKtx      = "1.8.5"
lifecycleVm      = "2.8.7"
lifecycleLd      = "2.8.7"
constraintlayout = "2.1.4"
viewpager2       = "1.1.0"
recyclerview     = "1.3.2"

# Coroutines
coroutines       = "1.8.1"

# UI
material         = "1.12.0"

# Room
room             = "2.8.4"

# Testing
junit            = "4.13.2"
junitExt         = "1.2.1"
espresso         = "3.6.1"
mockk            = "1.13.11"
robolectric      = "4.12.2"
turbine          = "1.1.0"
testCore         = "1.6.1"
testRunner       = "1.6.1"
testRules        = "1.6.1"

[libraries]
# Core
androidx-core-ktx          = { group = "androidx.core",              name = "core-ktx",               version.ref = "coreKtx"          }
androidx-appcompat         = { group = "androidx.appcompat",         name = "appcompat",              version.ref = "appcompat"         }
androidx-activity-ktx      = { group = "androidx.activity",          name = "activity-ktx",           version.ref = "activityKtx"       }
androidx-fragment-ktx      = { group = "androidx.fragment",          name = "fragment-ktx",           version.ref = "fragmentKtx"       }
androidx-constraintlayout  = { group = "androidx.constraintlayout",  name = "constraintlayout",       version.ref = "constraintlayout"  }
androidx-recyclerview      = { group = "androidx.recyclerview",      name = "recyclerview",           version.ref = "recyclerview"      }
androidx-viewpager2        = { group = "androidx.viewpager2",        name = "viewpager2",             version.ref = "viewpager2"        }

# Lifecycle
androidx-lifecycle-vm      = { group = "androidx.lifecycle",         name = "lifecycle-viewmodel-ktx", version.ref = "lifecycleVm"      }
androidx-lifecycle-ld      = { group = "androidx.lifecycle",         name = "lifecycle-livedata-ktx",  version.ref = "lifecycleLd"      }
androidx-lifecycle-runtime = { group = "androidx.lifecycle",         name = "lifecycle-runtime-ktx",   version.ref = "lifecycleLd"      }

# Coroutines
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx",     name = "kotlinx-coroutines-android", version.ref = "coroutines"    }
kotlinx-coroutines-core    = { group = "org.jetbrains.kotlinx",     name = "kotlinx-coroutines-core",    version.ref = "coroutines"    }

# UI
material                   = { group = "com.google.android.material", name = "material",              version.ref = "material"          }

# Room
room-runtime               = { group = "androidx.room",              name = "room-runtime",           version.ref = "room"              }
room-compiler              = { group = "androidx.room",              name = "room-compiler",          version.ref = "room"              }
room-ktx                   = { group = "androidx.room",              name = "room-ktx",               version.ref = "room"              }

# Testing
junit                      = { group = "junit",                      name = "junit",                  version.ref = "junit"             }
androidx-junit             = { group = "androidx.test.ext",          name = "junit",                  version.ref = "junitExt"          }
androidx-espresso-core     = { group = "androidx.test.espresso",     name = "espresso-core",          version.ref = "espresso"          }
mockk                      = { group = "io.mockk",                   name = "mockk",                  version.ref = "mockk"             }
robolectric                = { group = "org.robolectric",            name = "robolectric",            version.ref = "robolectric"       }
turbine                    = { group = "app.cash.turbine",           name = "turbine",                version.ref = "turbine"           }
androidx-test-core         = { group = "androidx.test",              name = "core-ktx",               version.ref = "testCore"          }
androidx-test-runner       = { group = "androidx.test",              name = "runner",                 version.ref = "testRunner"        }
androidx-test-rules        = { group = "androidx.test",              name = "rules",                  version.ref = "testRules"         }
androidx-espresso-contrib  = { group = "androidx.test.espresso",     name = "espresso-contrib",       version.ref = "espresso"          }
kotlinx-coroutines-test    = { group = "org.jetbrains.kotlinx",     name = "kotlinx-coroutines-test", version.ref = "coroutines"    }

[plugins]
android-application  = { id = "com.android.application", version.ref = "agp" }
